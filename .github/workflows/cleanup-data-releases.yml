# ascentai-data-center 저장소의 .github/workflows/cleanup-data-releases.yml 로 교체할 파일
#
# data_api(response_format=download_url)가 올린 release를 RETENTION_DAYS일 지나면
# release·태그 통째로 삭제한다.
# - 대상 태그: data-YYYYMMDD-NNN (data_api 1.0.19~, release당 최대 300개)
#              data-YYYYMMDD     (1.0.18 이하 일자별 release — 전환기 잔여분)
#   그 외 release(수동 업로드·검증용 등)는 건드리지 않음
# - 토큰: Actions 기본 github.token 사용 (PAT 불필요)
# - RETENTION_DAYS는 1 이상 유지 (자정 직전 응답의 다운로드 주소가 직후 삭제로 끊기는 경계 방지)
#
# 2026-11 개정 (2026-10-15부터 매일 실패):
# - 원인: asset이 수백 개 이상인 release는 통째 삭제가 GitHub 서버 시간 초과(502)로 실패
#   (341개는 502 뒤 서버에서 삭제 완료, 390개 이상은 남음) → data_api가 release당 300개로 나눔
# - 삭제는 release 통째 삭제만 사용. 502가 나도 잠시 뒤 실제로 사라졌으면 성공으로 처리,
#   남아 있으면 실패로 기록하고 다음 날 다시 시도. 하나가 실패해도 나머지는 계속 처리
# - 1.0.18 이하에서 쌓인 큰 release(390~1000개)는 통째 삭제가 안 되므로, 수동 실행 때
#   legacy_asset_delete=true 로 한 번 돌려 asset을 하나씩 지운 뒤 삭제 (정기 실행은 사용 안 함)

name: cleanup-data-releases

on:
  schedule:
    - cron: "20 16 * * *"   # 매일 16:20 UTC = 01:20 KST
  workflow_dispatch:         # 수동 실행용
    inputs:
      legacy_asset_delete:
        description: "통째 삭제가 실패한 release는 asset을 하나씩 지운 뒤 삭제 (1.0.18 이하 큰 release 정리용, 오래 걸림)"
        type: boolean
        default: false

permissions:
  contents: write            # release/태그/asset 삭제 권한

concurrency:
  group: cleanup-data-releases
  cancel-in-progress: false  # 앞선 실행이 아직 지우는 중이면 끝날 때까지 대기

env:
  RETENTION_DAYS: "2"        # 오늘 포함 최근 2일치(data-오늘*, data-어제*) 보존

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Delete data releases older than retention
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEGACY_ASSET_DELETE: ${{ inputs.legacy_asset_delete && 'true' || 'false' }}
        run: |
          set -uo pipefail
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%Y%m%d)
          [[ "$cutoff" =~ ^[0-9]{8}$ ]] || { echo "::error::cutoff 날짜 계산 실패: '${cutoff}'"; exit 1; }
          echo "cutoff: data-${cutoff} 이전(<) 태그 삭제 (legacy_asset_delete=${LEGACY_ASSET_DELETE})"

          release_exists() { gh release view "$1" --json tagName >/dev/null 2>&1; }

          delete_whole() {
            local tag=$1
            gh release delete "$tag" --yes --cleanup-tag && return 0
            # 502(서버 시간 초과)여도 서버에서 삭제가 이어서 끝나는 경우가 있어 잠시 뒤 확인
            sleep 15
            if ! release_exists "$tag"; then
              echo "  502 이후 서버에서 삭제 완료 확인"
              # release만 지워지고 태그가 남았을 수 있어 정리 (없으면 무시)
              gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
              return 0
            fi
            return 1
          }

          delete_assets_one_by_one() {
            local tag=$1 rid ids aid n=0
            rid=$(gh api "repos/${GH_REPO}/releases/tags/${tag}" -q .id) || return 1
            # 지우면서 페이지를 넘기면 목록이 밀리므로 id를 먼저 다 모은 뒤 삭제
            ids=$(gh api --paginate "repos/${GH_REPO}/releases/${rid}/assets?per_page=100" -q '.[].id') || return 1
            echo "  asset $(echo "$ids" | grep -c .)개 개별 삭제"
            for aid in $ids; do
              if ! gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}" >/dev/null; then
                sleep 60   # 쓰기 요청 속도 제한에 걸렸을 수 있어 잠시 쉬고 한 번 더
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/${aid}" >/dev/null || true
              fi
              n=$((n + 1)); [ $((n % 100)) -eq 0 ] && echo "  ... ${n}개"
              sleep 1
            done
          }

          tags=$(gh release list --limit 1000 --json tagName -q '.[].tagName' | sort) || {
            echo "::error::release 목록 조회 실패"; exit 1; }

          deleted=0; failed=0
          for tag in $tags; do
            case "$tag" in
              data-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              data-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9]) ;;
              *) continue ;;
            esac
            day=${tag:5:8}
            [ "$day" -lt "$cutoff" ] || continue
            echo "delete: ${tag}"
            if delete_whole "$tag"; then
              deleted=$((deleted + 1)); continue
            fi
            if [ "$LEGACY_ASSET_DELETE" = "true" ] && delete_assets_one_by_one "$tag" && delete_whole "$tag"; then
              deleted=$((deleted + 1)); continue
            fi
            echo "::error::${tag} 삭제 실패 (다음 실행에서 재시도)"
            failed=$((failed + 1))
          done

          echo "done: deleted=${deleted}, failed=${failed}"
          [ "$failed" -eq 0 ]
